name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Tests
        run: pytest --cov=csv_auditor --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  datasets:
    # Downloads ~5 MB of public CSVs and checks the auditor against an independent
    # reference implementation. Kept separate so a network hiccup does not hide test results.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/download_datasets.py
      - run: python scripts/generate_synthetic.py
      - run: python scripts/verify_datasets.py
